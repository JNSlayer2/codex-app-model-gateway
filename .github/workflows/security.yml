name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Security scan
        run: sh scripts/security-scan.sh
      - name: Gateway tests
        working-directory: runtime
        run: npm test
